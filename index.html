<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Terminal OS</title>
  <!-- Подключение Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Подключение стилей -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="pc-container">
    <div class="terminal-header">
      <div><span class="status-indicator"></span>SYSTEM_TERMINAL_V1.0</div>
      <div>SECURE</div>
    </div>

    <div class="chat-messages" id="chat-messages">
      <!-- Приветствие системы -->
      <div class="msg pc">
        <div class="msg-sender">SYSTEM_AI</div>
        <div class="msg-content">Терминал готов к работе. Введите команду или секретный код доступа.</div>
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Введите текст..." autocomplete="off" />
      <button id="send-btn">SEND</button>
    </div>
  </div>

  <!-- Подключение логики -->
  <script src="app.js"></script>
</body>
</html>
